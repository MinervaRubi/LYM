<!-- ==============================================================
     MÓDULO CRM: SOLICITUDES Y APROBACIÓN DE DESCUENTOS
     ARCHIVO: crm-descuentos.html
============================================================== -->

<div style="display: flex; flex-direction: column; gap: 1.5rem;">
    <!-- CABECERA -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-heading); margin:0;">
                <i class="fas fa-tags" style="color:var(--primary); margin-right:6px;"></i> Descuentos y Promociones
            </h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top:2px;">
                Flujo de descuentos: El empleado sugiere &rarr; El administrador aprueba &rarr; Notificación automática al cliente
            </p>
        </div>
        <button class="crm-btn crm-btn-primary" onclick="abrirModalGlobalSugerirDescuento()">
            <i class="fas fa-plus"></i> <span>+ Sugerir Descuento</span>
        </button>
    </div>

    <!-- TARJETAS RESUMEN / KPIS -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div class="crm-card" style="padding: 1.2rem; display:flex; align-items:center; gap: 14px; border-left: 4px solid #f59e0b;">
            <div style="width:48px; height:48px; border-radius:12px; background:#fef3c7; color:#d97706; display:flex; align-items:center; justify-content:center; font-size:1.4rem;">
                <i class="fas fa-hourglass-half"></i>
            </div>
            <div>
                <span style="font-size: 0.78rem; font-weight:700; color: var(--text-muted); text-transform:uppercase;">Pendientes</span>
                <h3 style="font-size: 1.6rem; font-weight:800; margin:0; color: #b45309;" id="kpiDescPendientes">0</h3>
            </div>
        </div>

        <div class="crm-card" style="padding: 1.2rem; display:flex; align-items:center; gap: 14px; border-left: 4px solid #10b981;">
            <div style="width:48px; height:48px; border-radius:12px; background:#d1fae5; color:#059669; display:flex; align-items:center; justify-content:center; font-size:1.4rem;">
                <i class="fas fa-check-circle"></i>
            </div>
            <div>
                <span style="font-size: 0.78rem; font-weight:700; color: var(--text-muted); text-transform:uppercase;">Aprobados</span>
                <h3 style="font-size: 1.6rem; font-weight:800; margin:0; color: #047857;" id="kpiDescAprobados">0</h3>
            </div>
        </div>

        <div class="crm-card" style="padding: 1.2rem; display:flex; align-items:center; gap: 14px; border-left: 4px solid #64748b;">
            <div style="width:48px; height:48px; border-radius:12px; background:#f1f5f9; color:#475569; display:flex; align-items:center; justify-content:center; font-size:1.4rem;">
                <i class="fas fa-times-circle"></i>
            </div>
            <div>
                <span style="font-size: 0.78rem; font-weight:700; color: var(--text-muted); text-transform:uppercase;">Rechazados</span>
                <h3 style="font-size: 1.6rem; font-weight:800; margin:0; color: #334155;" id="kpiDescRechazados">0</h3>
            </div>
        </div>
    </div>

    <!-- BARRA DE FILTROS Y PESTAÑAS -->
    <div class="crm-card" style="padding: 1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 1rem;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="crm-btn crm-btn-secondary crm-btn-sm tab-desc-btn active" data-estado="todos" onclick="filtrarDescuentosTab('todos', this)">
                Todos (<span id="countTabTodos">0</span>)
            </button>
            <button class="crm-btn crm-btn-secondary crm-btn-sm tab-desc-btn" data-estado="pendiente" onclick="filtrarDescuentosTab('pendiente', this)" style="border-color:#f59e0b; color:#b45309;">
                ⏳ Pendientes (<span id="countTabPendientes">0</span>)
            </button>
            <button class="crm-btn crm-btn-secondary crm-btn-sm tab-desc-btn" data-estado="aprobado" onclick="filtrarDescuentosTab('aprobado', this)" style="border-color:#10b981; color:#047857;">
                ✓ Aprobados (<span id="countTabAprobados">0</span>)
            </button>
            <button class="crm-btn crm-btn-secondary crm-btn-sm tab-desc-btn" data-estado="rechazado" onclick="filtrarDescuentosTab('rechazado', this)">
                ✕ Rechazados (<span id="countTabRechazados">0</span>)
            </button>
        </div>

        <div class="crm-input-group" style="min-width: 240px;">
            <i class="fas fa-search"></i>
            <input type="text" class="crm-input" id="inputBuscarDescuento" placeholder="Buscar por cliente o cupón..." oninput="filtrarDescuentosTexto(this.value)">
        </div>
    </div>

    <!-- TABLA DE SOLICITUDES -->
    <div class="crm-card" style="padding: 0; overflow:hidden;">
        <div class="crm-table-container">
            <table class="crm-table" style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Descuento</th>
                        <th>Sugerido Por / Motivo</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th style="text-align:center;">Acciones / Notificación</th>
                    </tr>
                </thead>
                <tbody id="tablaDescuentosBody">
                    <tr>
                        <td colspan="6" style="text-align:center; padding: 2.5rem; color:var(--text-muted);">
                            <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary); margin-bottom:10px;"></i>
                            <div>Cargando solicitudes de descuento...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function initModuloDescuentos() {
    let listaCompletaDescuentos = [];
    let estadoFiltroActual = 'todos';
    let textoFiltroActual = '';

    window.cargarDescuentosCRM = async function() {
        try {
            if (!window.currentUserCRM) {
                try {
                    const sResp = await fetch("php/check_session.php", { credentials: "same-origin" });
                    const sData = await sResp.json();
                    if (sData.authenticated && sData.user) {
                        window.currentUserCRM = sData.user;
                    }
                } catch (e) {}
            }

            const resp = await fetch("php/crm_api.php?resource=descuentos", { credentials: "same-origin" });
            const data = await resp.json();

            if (!data.success) {
                document.getElementById('tablaDescuentosBody').innerHTML = `
                    <tr><td colspan="6" style="text-align:center; padding:2rem; color:#ef4444;">Error: ${escapeHtml(data.error || 'No se pudo cargar la información')}</td></tr>
                `;
                return;
            }

            listaCompletaDescuentos = data.descuentos || [];
            actualizarContadoresDescuentos();
            renderizarTablaDescuentos();

            actualizarBadgeDescuentosSidebar(data.pendientes_count || 0);

        } catch (err) {
            document.getElementById('tablaDescuentosBody').innerHTML = `
                <tr><td colspan="6" style="text-align:center; padding:2rem; color:#ef4444;">Error de conexión: ${escapeHtml(err.message)}</td></tr>
            `;
        }
    };

    function actualizarContadoresDescuentos() {
        const pendientes = listaCompletaDescuentos.filter(d => d.estado === 'pendiente').length;
        const aprobados = listaCompletaDescuentos.filter(d => d.estado === 'aprobado').length;
        const rechazados = listaCompletaDescuentos.filter(d => d.estado === 'rechazado').length;
        const total = listaCompletaDescuentos.length;

        document.getElementById('kpiDescPendientes').textContent = pendientes;
        document.getElementById('kpiDescAprobados').textContent = aprobados;
        document.getElementById('kpiDescRechazados').textContent = rechazados;

        document.getElementById('countTabTodos').textContent = total;
        document.getElementById('countTabPendientes').textContent = pendientes;
        document.getElementById('countTabAprobados').textContent = aprobados;
        document.getElementById('countTabRechazados').textContent = rechazados;
    }

    window.filtrarDescuentosTab = function(estado, btn) {
        estadoFiltroActual = estado;
        document.querySelectorAll('.tab-desc-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderizarTablaDescuentos();
    };

    window.filtrarDescuentosTexto = function(texto) {
        textoFiltroActual = (texto || '').toLowerCase().trim();
        renderizarTablaDescuentos();
    };

    function renderizarTablaDescuentos() {
        const tbody = document.getElementById('tablaDescuentosBody');
        if (!tbody) return;

        let filtrados = listaCompletaDescuentos.filter(d => {
            const matchEstado = (estadoFiltroActual === 'todos') || (d.estado === estadoFiltroActual);
            const matchTexto = !textoFiltroActual || 
                (d.cliente_nombre && d.cliente_nombre.toLowerCase().includes(textoFiltroActual)) ||
                (d.cliente_correo && d.cliente_correo.toLowerCase().includes(textoFiltroActual)) ||
                (d.codigo_cupon && d.codigo_cupon.toLowerCase().includes(textoFiltroActual)) ||
                (d.trabajador_nombre && d.trabajador_nombre.toLowerCase().includes(textoFiltroActual)) ||
                (d.motivo && d.motivo.toLowerCase().includes(textoFiltroActual));
            return matchEstado && matchTexto;
        });

        if (filtrados.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center; padding: 2.5rem; color:var(--text-muted);">
                        <i class="fas fa-tag fa-2x" style="color:#cbd5e1; margin-bottom:10px; display:block;"></i>
                        No se encontraron solicitudes de descuento en esta sección.
                    </td>
                </tr>
            `;
            return;
        }

        const esAdmin = window.currentUserCRM && String(window.currentUserCRM.role).toLowerCase() === 'admin';

        tbody.innerHTML = filtrados.map(d => {
            const fechaFmt = new Date(d.fecha_solicitud).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            let badgeEstado = '';
            if (d.estado === 'pendiente') {
                badgeEstado = '<span class="crm-badge" style="background:#fef3c7; color:#b45309; border:1px solid #fde68a;"><i class="fas fa-clock"></i> Pendiente</span>';
            } else if (d.estado === 'aprobado') {
                badgeEstado = '<span class="crm-badge" style="background:#d1fae5; color:#065f46; border:1px solid #a7f3d0;"><i class="fas fa-check-circle"></i> Aprobado</span>';
            } else {
                badgeEstado = '<span class="crm-badge" style="background:#fee2e2; color:#991b1b; border:1px solid #fecaca;"><i class="fas fa-times-circle"></i> Rechazado</span>';
            }

            let accionesCol = '';
            if (d.estado === 'pendiente') {
                if (esAdmin) {
                    accionesCol = `
                        <div style="display:flex; gap:6px; justify-content:center;">
                            <button onclick="aprobarDescuentoModal(${d.id}, '${escapeHtml(d.cliente_nombre)}', ${d.porcentaje})" class="crm-btn crm-btn-sm" style="background:#10b981; color:white; border:none; padding:6px 12px;" title="Aprobar y Notificar al Cliente">
                                <i class="fas fa-check"></i> <span>Aprobar</span>
                            </button>
                            <button onclick="rechazarDescuentoModal(${d.id}, '${escapeHtml(d.cliente_nombre)}')" class="crm-btn crm-btn-secondary crm-btn-sm" style="color:#ef4444; border-color:#fca5a5; padding:6px 10px;" title="Rechazar solicitud">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                } else {
                    accionesCol = `<span style="font-size:0.8rem; color:#94a3b8; font-style:italic;"><i class="fas fa-hourglass-start"></i> En espera del Administrador</span>`;
                }
            } else if (d.estado === 'aprobado') {
                accionesCol = `
                    <div style="text-align:center;">
                        <span style="font-size:0.75rem; color:#059669; display:block; font-weight:600;"><i class="fas fa-paper-plane"></i> Notificación enviada</span>
                        <small style="font-size:0.72rem; color:#64748b;">Por: ${escapeHtml(d.admin_nombre || 'Admin')}</small>
                    </div>
                `;
            } else {
                accionesCol = `
                    <div style="text-align:center;">
                        <span style="font-size:0.75rem; color:#dc2626; display:block; font-weight:600;"><i class="fas fa-ban"></i> Rechazado</span>
                        <small style="font-size:0.72rem; color:#64748b;">${escapeHtml(d.comentario_admin || 'Sin comentarios')}</small>
                    </div>
                `;
            }

            return `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 12px 16px;">
                        <strong style="color:var(--text-heading); font-size:0.92rem; display:block;">${escapeHtml(d.cliente_nombre)}</strong>
                        <span style="font-size:0.78rem; color:var(--text-muted);">${escapeHtml(d.cliente_correo)}</span>
                        ${d.cliente_empresa && d.cliente_empresa !== 'Particular' ? `<span style="font-size:0.72rem; background:#f1f5f9; padding:2px 6px; border-radius:4px; margin-left:4px; color:#475569;">${escapeHtml(d.cliente_empresa)}</span>` : ''}
                    </td>
                    <td style="padding: 12px 16px;">
                        <div style="display:inline-flex; align-items:center; gap:6px;">
                            <span style="font-size:1.1rem; font-weight:800; color:var(--primary);">${d.porcentaje}% OFF</span>
                        </div>
                        ${d.codigo_cupon ? `<div style="font-size:0.75rem; font-family:monospace; background:#e0e7ff; color:#3730a3; padding:2px 6px; border-radius:4px; margin-top:3px; display:inline-block; font-weight:700;">${escapeHtml(d.codigo_cupon)}</div>` : ''}
                    </td>
                    <td style="padding: 12px 16px; max-width: 280px;">
                        <p style="margin:0; font-size:0.85rem; color:#334155; line-height:1.4;">${escapeHtml(d.motivo)}</p>
                        <span style="font-size:0.72rem; color:#64748b; margin-top:4px; display:block;">
                            <i class="fas fa-user-edit"></i> Sugerido por: <strong>${escapeHtml(d.trabajador_nombre)}</strong>
                        </span>
                    </td>
                    <td style="padding: 12px 16px;">
                        ${badgeEstado}
                    </td>
                    <td style="padding: 12px 16px; font-size:0.8rem; color:#64748b;">
                        ${fechaFmt}
                    </td>
                    <td style="padding: 12px 16px; text-align:center;">
                        ${accionesCol}
                    </td>
                </tr>
            `;
        }).join('');
    }

    // ACCIÓN: APROBAR DESCUENTO (ADMIN)
    window.aprobarDescuentoModal = async function(id, clienteNombre, porcentaje) {
        if (!confirm(`¿Confirmas aprobar el descuento del ${porcentaje}% para el cliente "${clienteNombre}"?\n\nAl aprobarlo, el cliente recibirá una NOTIFICACIÓN en su perfil con su código de cupón.`)) {
            return;
        }

        try {
            const resp = await fetch("php/crm_api.php?resource=aprobar_descuento", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id: id,
                    comentario_admin: "Aprobado por el Administrador"
                })
            });

            const data = await resp.json();
            if (data.success) {
                alert(`✅ ${data.message}`);
                cargarDescuentosCRM();
            } else {
                alert(`❌ Error: ${data.error}`);
            }
        } catch (e) {
            alert(`Error de conexión: ${e.message}`);
        }
    };

    // ACCIÓN: RECHAZAR DESCUENTO (ADMIN)
    window.rechazarDescuentoModal = async function(id, clienteNombre) {
        const motivo = prompt(`Ingresa un motivo para rechazar la solicitud de descuento de "${clienteNombre}":`, "No autorizado en este momento");
        if (motivo === null) return;

        try {
            const resp = await fetch("php/crm_api.php?resource=rechazar_descuento", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id: id,
                    comentario_admin: motivo || "No autorizado"
                })
            });

            const data = await resp.json();
            if (data.success) {
                alert("Solicitud rechazada correctamente.");
                cargarDescuentosCRM();
            } else {
                alert(`Error: ${data.error}`);
            }
        } catch (e) {
            alert(`Error de conexión: ${e.message}`);
        }
    };

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, "&#039;").replace(/"/g, "&quot;");
    }

    function actualizarBadgeDescuentosSidebar(count) {
        const badge = document.getElementById('badgeDescuentosSidebar');
        if (badge) {
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    }

    cargarDescuentosCRM();
})();
</script>
