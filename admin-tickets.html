<div class="crm-card">
    <div class="crm-card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
            <h3 class="crm-card-title"><i class="fas fa-headset" style="color:#7c3aed;"></i> Bandeja de Tickets de Atención a Clientes</h3>
            <p class="crm-card-subtitle">Atiende solicitudes de soporte, quejas y consultas generadas por los compradores.</p>
        </div>
        <button class="crm-btn crm-btn-secondary" onclick="window.cargarTicketsAdmin()">
            <i class="fas fa-rotate"></i> Actualizar Bandeja
        </button>
    </div>

    <div style="overflow-x:auto; margin-top:16px;">
        <table class="crm-table">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Cliente</th>
                    <th>Asunto y Mensaje</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Respuesta / Acción</th>
                </tr>
            </thead>
            <tbody id="tablaAdminTicketsBody">
                <tr>
                    <td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">
                        <i class="fas fa-spinner fa-spin"></i> Cargando tickets...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL RESPONDER TICKET -->
<div class="crm-modal-overlay" id="modalResponderTicket" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; border-radius:18px; max-width:520px; width:100%; padding:24px; box-shadow:0 15px 40px rgba(0,0,0,0.2);">
        <h4 style="margin:0 0 10px 0; color:#1e293b;"><i class="fas fa-reply" style="color:var(--primary);"></i> Responder Ticket <span id="lblTicketFolioModal">T-103</span></h4>
        <p id="lblTicketAsuntoModal" style="color:#64748b; font-size:0.9rem; margin-bottom:14px;"></p>

        <form onsubmit="window.guardarRespuestaTicket(event)">
            <input type="hidden" id="inputTicketIdResponder">
            <div class="crm-form-group">
                <label class="crm-form-label">Cambiar Estado:</label>
                <select id="selectNuevoEstadoTicket" class="crm-form-select">
                    <option value="Respondido">Respondido</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Cerrado">Cerrado</option>
                </select>
            </div>

            <div class="crm-form-group">
                <label class="crm-form-label">Mensaje de Respuesta al Cliente:</label>
                <textarea id="textareaRespuestaTicket" class="crm-form-textarea" rows="4" required placeholder="Escribe la respuesta oficial..."></textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                <button type="button" class="crm-btn crm-btn-secondary" onclick="window.cerrarModalResponderTicket()">Cancelar</button>
                <button type="submit" class="crm-btn crm-btn-primary" id="btnEnviarRespuestaTicket">
                    <i class="fas fa-paper-plane"></i> Enviar Respuesta
                </button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    window.escapeHtml = window.escapeHtml || function(str) {
        return String(str || '').replace(/[&<>"']/g, function(m) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
        });
    };

    window.mostrarNotificacion = window.mostrarNotificacion || function(msg, tipo) {
        if (typeof showNotification === 'function') {
            showNotification(msg, tipo || 'info');
        } else {
            alert(msg);
        }
    };

    window.ticketsAdminEnMemoria = window.ticketsAdminEnMemoria || [];

    window.cargarTicketsAdmin = async function() {
        const tbody = document.getElementById("tablaAdminTicketsBody");
        if (!tbody) return;

        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;"><i class="fas fa-spinner fa-spin"></i> Cargando tickets...</td></tr>';

        try {
            const resp = await fetch("php/tienda_api.php?resource=tickets&accion=todos_los_tickets&_t=" + Date.now(), { credentials: "same-origin" });
            const data = await resp.json();

            if (data.success && Array.isArray(data.tickets)) {
                window.ticketsAdminEnMemoria = data.tickets;
                if (data.tickets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:#94a3b8;"><i class="fas fa-info-circle"></i> No hay tickets registrados actualmente.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.tickets.map(t => {
                    const est = t.estado || 'En proceso';
                    let badgeColor = '#fef3c7; color:#b45309';
                    if (est.toLowerCase().includes('respondido')) badgeColor = '#dcfce7; color:#15803d';
                    if (est.toLowerCase().includes('cerrado')) badgeColor = '#f1f5f9; color:#64748b';

                    const folio = t.folio || ('T-' + t.id);
                    const clienteNom = t.cliente_nombre || ('Cliente #' + t.cliente_id);
                    const fechaStr = t.fecha || t.created_at || 'Reciente';

                    return `
                        <tr>
                            <td><strong style="color:var(--primary); font-family:monospace; font-size:0.95rem;">${window.escapeHtml(folio)}</strong></td>
                            <td>
                                <strong style="color:#0f172a;">${window.escapeHtml(clienteNom)}</strong>
                                ${t.cliente_correo ? `<div style="font-size:0.75rem; color:#64748b;">${window.escapeHtml(t.cliente_correo)}</div>` : ''}
                            </td>
                            <td>
                                <strong style="color:#1e293b;">${window.escapeHtml(t.asunto || '')}</strong>
                                <div style="font-size:0.82rem; color:#64748b; margin-top:2px;">${window.escapeHtml(t.mensaje || '')}</div>
                                ${t.respuesta ? `<div style="font-size:0.8rem; color:#059669; margin-top:4px; font-weight:600;"><i class="fas fa-check-circle"></i> Resp: ${window.escapeHtml(t.respuesta)}</div>` : ''}
                            </td>
                            <td style="font-size:0.82rem; color:#475569; white-space:nowrap;">${window.escapeHtml(fechaStr)}</td>
                            <td>
                                <span class="crm-badge" style="background:${badgeColor}; font-weight:700;">
                                    ${window.escapeHtml(est)}
                                </span>
                            </td>
                            <td>
                                <button class="crm-btn crm-btn-secondary crm-btn-sm" onclick="window.abrirModalResponderTicket(${t.id})">
                                    <i class="fas fa-reply"></i> Responder
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444; padding:20px;">${window.escapeHtml(data.error || 'No se pudieron consultar los tickets')}</td></tr>`;
            }
        } catch (e) {
            console.error("Error al cargar tickets:", e);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444; padding:20px;">Error al consultar tickets: ${window.escapeHtml(e.message)}</td></tr>`;
        }
    };

    window.abrirModalResponderTicket = function(id) {
        const t = (window.ticketsAdminEnMemoria || []).find(x => x.id == id);
        if (!t) return;

        document.getElementById("inputTicketIdResponder").value = t.id;
        document.getElementById("lblTicketFolioModal").textContent = t.folio || ('T-' + t.id);
        document.getElementById("lblTicketAsuntoModal").textContent = `Asunto: ${t.asunto} | Cliente: ${t.cliente_nombre || t.cliente_id}`;
        document.getElementById("textareaRespuestaTicket").value = t.respuesta || "";
        document.getElementById("selectNuevoEstadoTicket").value = t.estado || "Respondido";

        const modal = document.getElementById("modalResponderTicket");
        if (modal) modal.style.display = "flex";
    };

    window.cerrarModalResponderTicket = function() {
        const modal = document.getElementById("modalResponderTicket");
        if (modal) modal.style.display = "none";
    };

    window.guardarRespuestaTicket = async function(e) {
        if (e && e.preventDefault) e.preventDefault();
        const id = document.getElementById("inputTicketIdResponder").value;
        const respText = document.getElementById("textareaRespuestaTicket").value.trim();
        const est = document.getElementById("selectNuevoEstadoTicket").value;
        const btn = document.getElementById("btnEnviarRespuestaTicket");

        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
        }

        try {
            const resp = await fetch("php/tienda_api.php?resource=tickets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({
                    id: id,
                    accion: "responder",
                    respuesta: respText,
                    estado: est
                })
            });
            const d = await resp.json();
            if (d.success) {
                window.mostrarNotificacion("Respuesta enviada y ticket actualizado.", "success");
                window.cerrarModalResponderTicket();
                window.cargarTicketsAdmin();
            } else {
                window.mostrarNotificacion(d.error || "Error al actualizar", "error");
            }
        } catch (err) {
            window.mostrarNotificacion("Error de conexión: " + err.message, "error");
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Respuesta';
            }
        }
    };

    // Ejecución inmediata
    window.cargarTicketsAdmin();
})();
</script>
