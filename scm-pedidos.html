<!-- ==============================================================
     MÓDULO SCM: PEDIDOS (ÓRDENES DE REPOSICIÓN Y SUMINISTRO)
     CUMPLE PANTALLAS 11 Y 12 DE LA GUÍA VISUAL SCM
     ARCHIVO: scm-pedidos.html
============================================================== -->

<div style="display: flex; flex-direction: column; gap: 1.5rem;">
    <!-- CABECERA -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                <span class="badge" style="background: rgba(13,148,136,0.15); color: #0d9488; font-weight:700; font-size:0.75rem; padding: 2px 8px; border-radius: 6px;">SCM</span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Cadena de Suministros</span>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-heading); margin: 0;">Pedidos</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Gestión de pedidos de reposición o suministro con talleres y artesanos</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="crm-btn crm-btn-secondary crm-btn-sm" onclick="cargarPedidosSCM()">
                <i class="fas fa-sync-alt"></i> <span>Actualizar</span>
            </button>
            <button class="crm-btn crm-btn-primary" style="background: linear-gradient(135deg, #0d9488, #059669); border:none; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);" onclick="abrirModalNuevoPedidoSCM()">
                <i class="fas fa-plus"></i> <span>+ Generar pedido</span>
            </button>
        </div>
    </div>

    <!-- BARRA DE FILTROS (PANTALLA 11) -->
    <div class="crm-card" style="display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; padding: 1rem 1.25rem;">
        <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; width: 100%;">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-heading);">
                <label>Estado:</label>
                <select class="crm-select" id="filtroEstadoPedidoSCM" onchange="filtrarPedidosSCM()">
                    <option value="Todos">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Surtido">Surtido</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-heading);">
                <label>Origen:</label>
                <select class="crm-select" id="filtroOrigenPedidoSCM" onchange="filtrarPedidosSCM()">
                    <option value="Todos">Todos</option>
                    <option value="automatico">Automático (PUSH)</option>
                    <option value="manual">Manual</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-heading);">
                <label>Tipo:</label>
                <select class="crm-select" id="filtroTipoPedidoSCM" onchange="filtrarPedidosSCM()">
                    <option value="Todos">Todos</option>
                    <option value="Reposición">Reposición</option>
                    <option value="Venta">Venta</option>
                    <option value="Especial">Especial</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TABLA DE PEDIDOS (PANTALLA 11) -->
    <div class="crm-table-container">
        <table class="crm-table">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Proveedor</th>
                    <th style="text-align: center;">Cantidad</th>
                    <th style="text-align: center;">Origen</th>
                    <th style="text-align: center;">Estado</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbodyPedidosSCM">
                <tr>
                    <td colspan="8" style="text-align: center; padding: 3rem; color: #94a3b8;">
                        <i class="fas fa-spinner fa-spin fa-2x" style="color:#0d9488; margin-bottom: 10px;"></i>
                        <div>Cargando pedidos de suministro desde MySQL...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ==============================================================
     MODAL DE CREAR / EDITAR PEDIDO (PANTALLA 12)
============================================================== -->
<div class="crm-modal-backdrop" id="modalPedidoSCM" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center;">
    <div class="crm-modal" style="background:#ffffff; border-radius:16px; padding:24px; max-width:480px; width:95%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 40px rgba(0,0,0,0.25);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
            <h3 id="modalPedidoTitulo" style="margin:0; font-size:1.3rem; font-weight:800; color:#0f172a;">
                <i class="fas fa-file-invoice" style="color:#0d9488; margin-right:8px;"></i> Nuevo pedido
            </h3>
            <button onclick="cerrarModalNuevoPedidoSCM()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:#64748b; line-height:1;">&times;</button>
        </div>

        <form id="formPedidoSCM" onsubmit="guardarPedidoSCM(event)">
            <input type="hidden" id="pedFormId" value="0">
            <input type="hidden" id="pedFormFolio" value="">

            <!-- Estado del Pedido -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Estado del pedido *</label>
                <select id="pedFormEstado" class="crm-select" style="width:100%; font-weight:700;" required>
                    <option value="Pendiente">Pendiente (No suma inventario)</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Surtido">Surtido (Suma inventario)</option>
                    <option value="Cancelado">Cancelado (Descuenta si estaba surtido)</option>
                </select>
            </div>

            <!-- Producto -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Producto *</label>
                <select id="pedFormProducto" class="crm-select" style="width:100%;" required onchange="onSelectProductoPedido()">
                    <option value="">Selecciona un producto</option>
                </select>
            </div>

            <!-- Cantidad -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Cantidad *</label>
                <input type="number" id="pedFormCantidad" class="crm-input" value="10" min="1" required>
            </div>

            <!-- Tipo -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Tipo *</label>
                <select id="pedFormTipo" class="crm-select" style="width:100%;" required>
                    <option value="Reposición">Reposición</option>
                    <option value="Venta">Venta</option>
                    <option value="Especial">Especial</option>
                </select>
            </div>

            <!-- Proveedor (Solo proveedores existentes y activos) -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Proveedor *</label>
                <select id="pedFormProveedor" class="crm-select" style="width:100%;" required>
                    <option value="">Selecciona un proveedor</option>
                </select>
            </div>

            <!-- Fecha -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Fecha *</label>
                <input type="date" id="pedFormFecha" class="crm-input" required>
            </div>

            <!-- Notas -->
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Notas</label>
                <textarea id="pedFormNotas" class="crm-input" style="height:60px; resize:vertical;" placeholder="Notas adicionales de la orden..."></textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; border-top:1px solid #e2e8f0; padding-top:14px;">
                <button type="button" class="crm-btn crm-btn-secondary" onclick="cerrarModalNuevoPedidoSCM()">Cancelar</button>
                <button type="submit" class="crm-btn crm-btn-primary" style="background:#0d9488;"><i class="fas fa-check"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    var pedidosSCMList = pedidosSCMList || [];
    var productosCatalogoPedido = [];
    var proveedoresActivosPedido = [];

    function onSelectProductoPedido() {
        var sProd = document.getElementById("pedFormProducto");
        var sProv = document.getElementById("pedFormProveedor");
        if (!sProd || !sProv) return;
        var pId = Number(sProd.value);
        var pObj = productosCatalogoPedido.find(p => p.id === pId);
        if (pObj && pObj.proveedor_id) {
            sProv.value = pObj.proveedor_id;
        }
    }

    async function cargarCatalogosParaPedido() {
        try {
            // Cargar productos
            var rProd = await fetch("php/scm_api.php?resource=productos");
            var dProd = await rProd.json();
            if (dProd.success && Array.isArray(dProd.productos)) {
                productosCatalogoPedido = dProd.productos;
                var sProd = document.getElementById("pedFormProducto");
                if (sProd) {
                    var curProd = sProd.value;
                    sProd.innerHTML = '<option value="">Selecciona un producto</option>' + 
                        productosCatalogoPedido.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                    if (curProd) sProd.value = curProd;
                }
            }

            // Cargar proveedores existentes y activos
            var rProv = await fetch("php/scm_api.php?resource=proveedores&activos=1");
            var dProv = await rProv.json();
            if (dProv.success && Array.isArray(dProv.proveedores)) {
                proveedoresActivosPedido = dProv.proveedores.filter(pr => pr.activo);
                var sProv = document.getElementById("pedFormProveedor");
                if (sProv) {
                    var curProv = sProv.value;
                    sProv.innerHTML = '<option value="">Selecciona un proveedor</option>' + 
                        proveedoresActivosPedido.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
                    if (curProv) sProv.value = curProv;
                }
            }
        } catch (e) {
            console.warn("Error cargando catálogos para pedido:", e);
        }
    }

    async function cargarPedidosSCM() {
        var tbody = document.getElementById("tbodyPedidosSCM");
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:#64748b;"><i class="fas fa-spinner fa-spin"></i> Cargando pedidos desde MySQL...</td></tr>`;
        }

        try {
            await cargarCatalogosParaPedido();
            var resp = await fetch("php/scm_api.php?resource=pedidos");
            if (!resp.ok) throw new Error("Error en el servidor");

            var data = await resp.json();
            if (data.success && Array.isArray(data.pedidos)) {
                pedidosSCMList = data.pedidos;
                filtrarPedidosSCM();

                // Si viene prellenado desde inventario
                if (window.scmPedidoPrellenado) {
                    abrirModalNuevoPedidoSCM();
                    if (window.scmPedidoPrellenado.producto_id) {
                        var pSel = document.getElementById("pedFormProducto");
                        if (pSel) pSel.value = window.scmPedidoPrellenado.producto_id;
                    }
                    if (window.scmPedidoPrellenado.proveedor_id) {
                        var prSel = document.getElementById("pedFormProveedor");
                        if (prSel) prSel.value = window.scmPedidoPrellenado.proveedor_id;
                    }
                    window.scmPedidoPrellenado = null;
                }
            } else {
                throw new Error(data.error || "No se recibieron pedidos");
            }
        } catch (err) {
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Error al conectar con pedidos: ${err.message}</td></tr>`;
            }
        }
    }

    function renderizarTablaPedidosSCM(items) {
        var tbody = document.getElementById("tbodyPedidosSCM");
        if (!tbody) return;
        if (!items || items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:#64748b;">No se encontraron pedidos con los filtros seleccionados.</td></tr>`;
            return;
        }

        tbody.innerHTML = items.map(function(p) {
            var estado = p.estado || 'Pendiente';
            
            // Colores requeridos por la guía de pruebas:
            // Pendiente ámbar, En proceso azul, Surtido verde, Cancelado rojo. Solo esos 4 estados.
            var badgeBg = 'rgba(245,158,11,0.15)';
            var badgeColor = '#d97706'; // Pendiente ámbar

            if (estado === 'En proceso') {
                badgeBg = 'rgba(37,99,235,0.15)';
                badgeColor = '#2563eb'; // En proceso azul
            } else if (estado === 'Surtido') {
                badgeBg = 'rgba(5,150,105,0.15)';
                badgeColor = '#059669'; // Surtido verde
            } else if (estado === 'Cancelado') {
                badgeBg = 'rgba(239,68,68,0.15)';
                badgeColor = '#ef4444'; // Cancelado rojo
            }

            // Columna Origen: Automático (PUSH) en verde o Manual en gris
            var esAuto = (p.origen === 'automatico');
            var origenHtml = esAuto 
                ? `<span class="badge" style="background:rgba(5,150,105,0.15); color:#059669; font-weight:700; font-size:0.75rem; padding:4px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:4px;"><i class="fas fa-robot"></i> Automático (PUSH)</span>`
                : `<span class="badge" style="background:#f1f5f9; color:#64748b; font-weight:600; font-size:0.75rem; padding:4px 8px; border-radius:6px;">Manual</span>`;

            return `
                <tr>
                    <td style="font-weight: 800; color: #0f172a; font-family: monospace; font-size: 0.95rem;">${p.folio}</td>
                    <td style="color:#64748b; font-size:0.85rem; font-weight:500;">${p.fecha}</td>
                    <td style="font-weight:700; color:#0f172a;">${p.producto}</td>
                    <td style="color:#334155; font-size:0.85rem; font-weight:600;"><i class="fas fa-truck" style="color:#94a3b8; margin-right:4px;"></i>${p.proveedor}</td>
                    <td style="text-align:center; font-weight:700; color:#0f172a;">${p.cantidad}</td>
                    <td style="text-align:center;">${origenHtml}</td>
                    <td style="text-align:center;">
                        <select class="crm-select" onchange="cambiarEstadoPedidoRapido(${p.id}, this.value, '${p.folio}')" style="background:${badgeBg}; color:${badgeColor}; font-weight:800; font-size:0.78rem; padding:4px 8px; border-radius:6px; border:1px solid ${badgeColor}40; cursor:pointer; outline:none; text-align-last:center;">
                            <option value="Pendiente" ${estado === 'Pendiente' ? 'selected' : ''} style="background:#fff; color:#d97706; font-weight:700;">Pendiente</option>
                            <option value="En proceso" ${estado === 'En proceso' ? 'selected' : ''} style="background:#fff; color:#2563eb; font-weight:700;">En proceso</option>
                            <option value="Surtido" ${estado === 'Surtido' ? 'selected' : ''} style="background:#fff; color:#059669; font-weight:700;">Surtido</option>
                            <option value="Cancelado" ${estado === 'Cancelado' ? 'selected' : ''} style="background:#fff; color:#ef4444; font-weight:700;">Cancelado</option>
                        </select>
                    </td>
                    <td style="text-align: right;">
                        <div style="display:flex; justify-content:flex-end; gap:6px; align-items:center;">
                            ${estado !== 'Surtido' && estado !== 'Cancelado' ? `
                                <button class="crm-btn crm-btn-secondary crm-btn-sm" title="Marcar como Surtido e ingresar stock" onclick="cambiarEstadoPedidoRapido(${p.id}, 'Surtido', '${p.folio}')" style="padding:4px 8px; color:#059669; font-weight:600;">
                                    <i class="fas fa-check-circle"></i> Surtir
                                </button>
                            ` : ''}
                            ${estado === 'Surtido' ? `
                                <button class="crm-btn crm-btn-secondary crm-btn-sm" title="Regresar pedido a Pendiente (para probar B-L4 de no duplicidad)" onclick="cambiarEstadoPedidoRapido(${p.id}, 'Pendiente', '${p.folio}')" style="padding:4px 8px; color:#d97706; font-weight:600;">
                                    <i class="fas fa-undo"></i> Pendiente
                                </button>
                            ` : ''}
                            <button class="crm-btn crm-btn-secondary crm-btn-sm" title="Editar pedido" onclick="abrirModalEditarPedidoSCM(${p.id})" style="padding:4px 8px; color:#2563eb;">
                                <i class="fas fa-pencil"></i>
                            </button>
                            ${estado !== 'Cancelado' ? `
                                <button class="crm-btn crm-btn-secondary crm-btn-sm" title="Cancelar pedido (resta cantidad del inventario si estaba surtido)" onclick="cambiarEstadoPedidoRapido(${p.id}, 'Cancelado', '${p.folio}')" style="padding:4px 8px; color:#ef4444;">
                                    <i class="fas fa-ban"></i>
                                </button>
                            ` : `
                                <button class="crm-btn crm-btn-secondary crm-btn-sm" title="Reactivar pedido (Pendiente)" onclick="cambiarEstadoPedidoRapido(${p.id}, 'Pendiente', '${p.folio}')" style="padding:4px 8px; color:#d97706; font-weight:600;">
                                    <i class="fas fa-redo"></i>
                                </button>
                            `}
                        </div>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function filtrarPedidosSCM() {
        var est = document.getElementById("filtroEstadoPedidoSCM").value;
        var ori = document.getElementById("filtroOrigenPedidoSCM") ? document.getElementById("filtroOrigenPedidoSCM").value : 'Todos';
        var tip = document.getElementById("filtroTipoPedidoSCM").value;

        var filtrados = (window.pedidosSCMList || []).filter(function(p) {
            var matchEst = (est === "Todos") || (p.estado && p.estado.toLowerCase() === est.toLowerCase());
            var matchOri = (ori === "Todos") || (p.origen && p.origen.toLowerCase() === ori.toLowerCase());
            var matchTip = (tip === "Todos") || (p.tipo && p.tipo.toLowerCase() === tip.toLowerCase());
            return matchEst && matchOri && matchTip;
        });

        renderizarTablaPedidosSCM(filtrados);
    }

    function abrirModalNuevoPedidoSCM() {
        document.getElementById("modalPedidoTitulo").innerHTML = '<i class="fas fa-file-invoice" style="color:#0d9488; margin-right:8px;"></i> Nuevo pedido';
        document.getElementById("pedFormId").value = "0";
        document.getElementById("pedFormFolio").value = "PC-" + String(Math.floor(Math.random() * 899 + 100));
        document.getElementById("pedFormProducto").value = "";
        document.getElementById("pedFormCantidad").value = "10";
        document.getElementById("pedFormTipo").value = "Reposición";
        document.getElementById("pedFormProveedor").value = "";
        document.getElementById("pedFormFecha").value = new Date().toISOString().split('T')[0];
        document.getElementById("pedFormNotas").value = "";
        var estEl = document.getElementById("pedFormEstado");
        if (estEl) estEl.value = "Pendiente";

        document.getElementById("modalPedidoSCM").style.display = "flex";
    }

    function abrirModalEditarPedidoSCM(id) {
        var ped = (window.pedidosSCMList || []).find(function(p) { return p.id === id; });
        if (!ped) return;

        document.getElementById("modalPedidoTitulo").innerHTML = '<i class="fas fa-pencil" style="color:#0d9488; margin-right:8px;"></i> Editar pedido ' + ped.folio;
        document.getElementById("pedFormId").value = ped.id;
        document.getElementById("pedFormFolio").value = ped.folio;
        document.getElementById("pedFormProducto").value = ped.producto_id || "";
        document.getElementById("pedFormCantidad").value = ped.cantidad || 1;
        document.getElementById("pedFormTipo").value = ped.tipo || "Reposición";
        document.getElementById("pedFormProveedor").value = ped.proveedor_id || "";
        document.getElementById("pedFormFecha").value = ped.fecha_iso || (ped.fecha ? String(ped.fecha).substring(0, 10) : new Date().toISOString().split('T')[0]);
        document.getElementById("pedFormNotas").value = ped.notas || "";
        var estEl = document.getElementById("pedFormEstado");
        if (estEl) estEl.value = ped.estado || "Pendiente";

        document.getElementById("modalPedidoSCM").style.display = "flex";
    }

    function cerrarModalNuevoPedidoSCM() {
        document.getElementById("modalPedidoSCM").style.display = "none";
    }

    async function guardarPedidoSCM(ev) {
        if (ev) ev.preventDefault();
        var estEl = document.getElementById("pedFormEstado");
        var estadoVal = estEl ? (estEl.value || "Pendiente") : "Pendiente";

        var payload = {
            id: Number(document.getElementById("pedFormId").value),
            folio: document.getElementById("pedFormFolio").value,
            producto_id: Number(document.getElementById("pedFormProducto").value),
            cantidad: Number(document.getElementById("pedFormCantidad").value),
            tipo: document.getElementById("pedFormTipo").value,
            proveedor_id: Number(document.getElementById("pedFormProveedor").value),
            fecha: document.getElementById("pedFormFecha").value,
            notas: document.getElementById("pedFormNotas").value.trim(),
            estado: estadoVal
        };

        if (!payload.producto_id) {
            mostrarNotificacion("Por favor selecciona un producto.", "warning");
            return;
        }
        if (!payload.proveedor_id) {
            mostrarNotificacion("Por favor selecciona un proveedor.", "warning");
            return;
        }

        try {
            var resp = await fetch("php/scm_api.php?resource=guardar_pedido", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            var data = await resp.json();
            if (data.success) {
                cerrarModalNuevoPedidoSCM();
                mostrarNotificacion(data.message || "Pedido guardado exitosamente.", "success");
                cargarPedidosSCM();
            } else {
                mostrarNotificacion("Error al guardar pedido: " + (data.error || "Error desconocido"), "error");
            }
        } catch (e) {
            mostrarNotificacion("Error de conexión: " + e.message, "error");
        }
    }

    async function cambiarEstadoPedidoRapido(id, nuevoEstado, folio) {
        var ped = (window.pedidosSCMList || []).find(function(p) { return Number(p.id) === Number(id); });
        var estadoActual = ped ? (ped.estado || 'Pendiente') : '';
        if (estadoActual === nuevoEstado) return;

        var mensajeConfirm = `¿Deseas cambiar el estado del pedido ${folio} a '${nuevoEstado}'?`;
        var esPeligroso = false;
        if (nuevoEstado === 'Surtido') {
            mensajeConfirm = `¿Confirmas que el pedido ${folio} ha sido recibido y surtido? Esto registrará la entrada asociada e incrementará el inventario en almacén.`;
        } else if (nuevoEstado === 'Cancelado') {
            esPeligroso = true;
            if (estadoActual === 'Surtido' || (ped && Number(ped.entrada_registrada) === 1)) {
                mensajeConfirm = `¿Deseas cancelar el pedido ${folio}? Al estar surtido, esto RESTARÁ las ${ped ? ped.cantidad : ''} piezas del inventario del producto y registrará la salida por cancelación.`;
            } else {
                mensajeConfirm = `¿Deseas cancelar el pedido ${folio}?`;
            }
        } else if (nuevoEstado === 'Pendiente' && estadoActual === 'Surtido') {
            mensajeConfirm = `¿Deseas regresar el pedido ${folio} a 'Pendiente'? (Al volver a surtirlo se verificará que no se duplique inventario - Caso B-L4).`;
        }

        var confirmed = await mostrarConfirmacion(mensajeConfirm, {
            titulo: "Cambio de Estado - Pedido " + folio,
            tipo: esPeligroso ? "danger" : "warning",
            esPeligroso: esPeligroso,
            textoConfirmar: "Actualizar Estado",
            textoCancelar: "Cancelar"
        });

        if (!confirmed) {
            // Re-render para restaurar select en caso de cancelar
            filtrarPedidosSCM();
            return;
        }

        try {
            var resp = await fetch("php/scm_api.php?resource=cambiar_estado_pedido", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, estado: nuevoEstado })
            });
            var data = await resp.json();
            if (data.success) {
                mostrarNotificacion(data.message || "Estado del pedido actualizado.", "success");
                cargarPedidosSCM();
            } else {
                mostrarNotificacion("Error: " + (data.error || "No se pudo actualizar el estado"), "error");
                cargarPedidosSCM();
            }
        } catch (e) {
            mostrarNotificacion("Error de conexión: " + e.message, "error");
            cargarPedidosSCM();
        }
    }

    async function marcarPedidoSurtido(id, folio) {
        return cambiarEstadoPedidoRapido(id, 'Surtido', folio);
    }

    async function cancelarPedidoSCM(id, folio) {
        return cambiarEstadoPedidoRapido(id, 'Cancelado', folio);
    }

    // Expose all functions to global window scope
    window.pedidosSCMList = pedidosSCMList;
    window.cargarCatalogosParaPedido = cargarCatalogosParaPedido;
    window.cargarPedidosSCM = cargarPedidosSCM;
    window.renderizarTablaPedidosSCM = renderizarTablaPedidosSCM;
    window.filtrarPedidosSCM = filtrarPedidosSCM;
    window.abrirModalNuevoPedidoSCM = abrirModalNuevoPedidoSCM;
    window.abrirModalEditarPedidoSCM = abrirModalEditarPedidoSCM;
    window.cerrarModalNuevoPedidoSCM = cerrarModalNuevoPedidoSCM;
    window.guardarPedidoSCM = guardarPedidoSCM;
    window.marcarPedidoSurtido = marcarPedidoSurtido;
    window.cancelarPedidoSCM = cancelarPedidoSCM;
    window.cambiarEstadoPedidoRapido = cambiarEstadoPedidoRapido;
    window.onSelectProductoPedido = onSelectProductoPedido;

    cargarPedidosSCM();
</script>
