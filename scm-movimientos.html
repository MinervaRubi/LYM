<!-- ==============================================================
     MÓDULO SCM: MOVIMIENTOS DE INVENTARIO (LISTADO Y FORMULARIO)
     CUMPLE PANTALLAS 7 Y 8 DE LA GUÍA VISUAL SCM
     ARCHIVO: scm-movimientos.html
============================================================== -->

<div style="display: flex; flex-direction: column; gap: 1.5rem;">
    <!-- CABECERA -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                <span class="badge" style="background: rgba(13,148,136,0.15); color: #0d9488; font-weight:700; font-size:0.75rem; padding: 2px 8px; border-radius: 6px;">SCM</span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Cadena de Suministros</span>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-heading); margin: 0;">Movimientos de inventario</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Registra y consulta entradas y salidas de almacén en tiempo real</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="crm-btn crm-btn-secondary crm-btn-sm" onclick="cargarMovimientosSCM()">
                <i class="fas fa-sync-alt"></i> <span>Actualizar</span>
            </button>
            <button class="crm-btn crm-btn-primary" style="background: linear-gradient(135deg, #0d9488, #059669); border:none; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);" onclick="abrirModalNuevoMovimientoSCM()">
                <i class="fas fa-plus"></i> <span>+ Nuevo movimiento</span>
            </button>
        </div>
    </div>

    <!-- BARRA DE FILTROS (PANTALLA 7) -->
    <div class="crm-card" style="display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; padding: 1rem 1.25rem;">
        <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; width: 100%;">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-heading);">
                <label>Tipo:</label>
                <select class="crm-select" id="filtroTipoMovSCM" onchange="cargarMovimientosSCM()">
                    <option value="Todos">Todos</option>
                    <option value="entrada">Entrada</option>
                    <option value="salida">Salida</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-heading); flex: 1; min-width: 200px;">
                <label>Producto:</label>
                <select class="crm-select" id="filtroProductoMovSCM" style="width: 100%;" onchange="cargarMovimientosSCM()">
                    <option value="0">Todos los productos</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TABLA DE MOVIMIENTOS (PANTALLA 7) -->
    <div class="crm-table-container">
        <table class="crm-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th style="text-align: center;">Tipo</th>
                    <th style="text-align: center;">Cantidad</th>
                    <th>Motivo</th>
                    <th>Usuario</th>
                </tr>
            </thead>
            <tbody id="tbodyMovimientosSCM">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 3rem; color: #94a3b8;">
                        <i class="fas fa-spinner fa-spin fa-2x" style="color:#0d9488; margin-bottom: 10px;"></i>
                        <div>Cargando historial de movimientos desde MySQL...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ==============================================================
     MODAL DE REGISTRO DE MOVIMIENTO (PANTALLA 8)
============================================================== -->
<div class="crm-modal-backdrop" id="modalMovimientoSCM" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center;">
    <div class="crm-modal" style="background:#ffffff; border-radius:16px; padding:24px; max-width:480px; width:95%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 40px rgba(0,0,0,0.25);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
            <h3 style="margin:0; font-size:1.3rem; font-weight:800; color:#0f172a;">
                <i class="fas fa-right-left" style="color:#0d9488; margin-right:8px;"></i> Nuevo movimiento
            </h3>
            <button onclick="cerrarModalNuevoMovimientoSCM()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:#64748b; line-height:1;">&times;</button>
        </div>

        <form id="formMovimientoSCM" onsubmit="guardarMovimientoSCM(event)">
            <!-- Producto -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Producto *</label>
                <select id="movFormProducto" class="crm-select" style="width:100%;" required onchange="actualizarInfoStockSeleccionado()">
                    <option value="">Selecciona un producto</option>
                </select>
                <div id="movStockInfo" style="font-size:0.78rem; color:#64748b; margin-top:4px;">Stock actual disponible: -</div>
            </div>

            <!-- Tipo (Radio Buttons: Entrada / Salida) -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:8px;">Tipo *</label>
                <div style="display:flex; gap:20px; align-items:center;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; color:#059669;">
                        <input type="radio" name="movTipo" value="entrada" checked style="accent-color:#059669;">
                        <i class="fas fa-arrow-down-left"></i> Entrada
                    </label>
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; color:#ea580c;">
                        <input type="radio" name="movTipo" value="salida" style="accent-color:#ea580c;">
                        <i class="fas fa-arrow-up-right"></i> Salida
                    </label>
                </div>
            </div>

            <!-- Cantidad -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Cantidad *</label>
                <input type="number" id="movFormCantidad" class="crm-input" value="1" min="1" required>
            </div>

            <!-- Motivo -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Motivo *</label>
                <select id="movFormMotivo" class="crm-select" style="width:100%;" required>
                    <option value="">Selecciona un motivo</option>
                    <option value="Compra">Compra</option>
                    <option value="Pedido">Pedido</option>
                    <option value="Venta">Venta</option>
                    <option value="Ajuste">Ajuste</option>
                    <option value="Merma">Merma</option>
                </select>
            </div>

            <!-- Fecha -->
            <div style="margin-bottom: 1.25rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Fecha *</label>
                <input type="date" id="movFormFecha" class="crm-input" required>
            </div>

            <!-- Usuario -->
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:4px;">Usuario *</label>
                <select id="movFormUsuario" class="crm-select" style="width:100%;" required>
                    <option value="Admin">Admin</option>
                    <option value="Usuario1">Usuario1</option>
                    <option value="Staff">Staff</option>
                </select>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; border-top:1px solid #e2e8f0; padding-top:14px;">
                <button type="button" class="crm-btn crm-btn-secondary" onclick="cerrarModalNuevoMovimientoSCM()">Cancelar</button>
                <button type="submit" class="crm-btn crm-btn-primary" style="background:#0d9488;"><i class="fas fa-check"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    var productosDisponiblesMov = productosDisponiblesMov || [];

    async function cargarUsuariosParaSelectMov() {
        try {
            var resp = await fetch("php/scm_api.php?resource=usuarios");
            var data = await resp.json();
            if (data.success && Array.isArray(data.usuarios)) {
                var uSel = document.getElementById("movFormUsuario");
                if (uSel) {
                    var curVal = uSel.value;
                    uSel.innerHTML = data.usuarios.map(u => `<option value="${u.username}">${u.username} (${u.role})</option>`).join('');
                    if (curVal) uSel.value = curVal;
                }
            }
        } catch (e) {
            console.warn("Error cargando usuarios para movimientos:", e);
        }
    }

    async function cargarProductosParaFiltroMov() {
        try {
            var resp = await fetch("php/scm_api.php?resource=productos");
            var data = await resp.json();
            if (data.success && Array.isArray(data.productos)) {
                productosDisponiblesMov = data.productos;
                
                // Llenar filtro de cabecera
                var fSel = document.getElementById("filtroProductoMovSCM");
                if (fSel) {
                    var curFilterVal = fSel.value;
                    fSel.innerHTML = '<option value="0">Todos los productos</option>' + 
                        productosDisponiblesMov.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                    if (curFilterVal) fSel.value = curFilterVal;
                }

                // Llenar select de modal
                var mSel = document.getElementById("movFormProducto");
                if (mSel) {
                    var curModalVal = mSel.value;
                    mSel.innerHTML = '<option value="">Selecciona un producto</option>' + 
                        productosDisponiblesMov.map(p => `<option value="${p.id}" data-stock="${p.stock_actual}">${p.name} (Stock: ${p.stock_actual})</option>`).join('');
                    if (curModalVal) mSel.value = curModalVal;
                }
            }
        } catch (e) {
            console.warn("Error cargando productos para movimientos:", e);
        }
    }

    function actualizarInfoStockSeleccionado() {
        var sel = document.getElementById("movFormProducto");
        var info = document.getElementById("movStockInfo");
        if (!sel || !info) return;
        var opt = sel.options[sel.selectedIndex];
        if (opt && opt.value) {
            var st = opt.getAttribute("data-stock") || 0;
            info.innerHTML = `Stock actual disponible: <strong style="color:#0f172a;">${st} unidades</strong>`;
        } else {
            info.innerHTML = "Stock actual disponible: -";
        }
    }

    async function cargarMovimientosSCM() {
        var tbody = document.getElementById("tbodyMovimientosSCM");
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:#64748b;"><i class="fas fa-spinner fa-spin"></i> Cargando movimientos desde MySQL...</td></tr>`;
        }

        var tipoSel = document.getElementById("filtroTipoMovSCM");
        var prodSel = document.getElementById("filtroProductoMovSCM");
        var tipo = tipoSel ? tipoSel.value : 'Todos';
        var prodId = prodSel ? prodSel.value : '0';

        var url = "php/scm_api.php?resource=movimientos";
        if (tipo && tipo !== "Todos") url += `&tipo=${tipo}`;
        if (prodId && Number(prodId) > 0) url += `&producto_id=${prodId}`;

        try {
            var resp = await fetch(url);
            if (!resp.ok) throw new Error("Error en la respuesta del servidor");

            var data = await resp.json();
            if (data.success && Array.isArray(data.movimientos)) {
                renderizarTablaMovimientosSCM(data.movimientos);
            } else {
                throw new Error(data.error || "No se recibieron datos");
            }
        } catch (err) {
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Error al conectar con movimientos: ${err.message}</td></tr>`;
            }
        }
    }

    function renderizarTablaMovimientosSCM(items) {
        var tbody = document.getElementById("tbodyMovimientosSCM");
        if (!tbody) return;
        if (!items || items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:#64748b;">No hay movimientos registrados con los filtros aplicados.</td></tr>`;
            return;
        }

        tbody.innerHTML = items.map(m => {
            var esEntrada = (m.tipo === 'entrada');
            var signo = esEntrada ? '+' : '-';
            var badgeBg = esEntrada ? 'rgba(5,150,105,0.12)' : 'rgba(234,88,12,0.12)';
            var badgeColor = esEntrada ? '#059669' : '#ea580c';
            var labelTipo = esEntrada ? 'Entrada' : 'Salida';

            return `
                <tr>
                    <td style="color:#64748b; font-size:0.85rem; font-weight:500;">${m.fecha_corta || m.fecha_formato}</td>
                    <td style="font-weight:700; color:#0f172a;">${m.producto}</td>
                    <td style="text-align:center;">
                        <span class="badge" style="background:${badgeBg}; color:${badgeColor}; font-weight:700; font-size:0.75rem; padding:4px 10px; border-radius:6px;">
                            ${labelTipo}
                        </span>
                    </td>
                    <td style="text-align:center; font-weight:800; font-size:0.95rem; color:${badgeColor};">
                        ${signo}${m.cantidad}
                    </td>
                    <td style="color:#475569; font-weight:500;">${m.motivo || 'Operación'}</td>
                    <td style="color:#0f172a; font-weight:600;"><i class="fas fa-user-circle" style="color:#94a3b8; margin-right:4px;"></i>${m.usuario || 'Admin'}</td>
                </tr>
            `;
        }).join("");
    }

    function abrirModalNuevoMovimientoSCM() {
        document.getElementById("movFormProducto").value = "";
        document.getElementById("movStockInfo").innerHTML = "Stock actual disponible: -";
        var rEntrada = document.querySelector("input[name='movTipo'][value='entrada']");
        if (rEntrada) rEntrada.checked = true;
        document.getElementById("movFormCantidad").value = "1";
        document.getElementById("movFormMotivo").value = "Compra";
        document.getElementById("movFormFecha").value = new Date().toISOString().split('T')[0];

        cargarUsuariosParaSelectMov();
        document.getElementById("modalMovimientoSCM").style.display = "flex";
    }

    function cerrarModalNuevoMovimientoSCM() {
        var modal = document.getElementById("modalMovimientoSCM");
        if (modal) modal.style.display = "none";
    }

    async function guardarMovimientoSCM(ev) {
        ev.preventDefault();
        var productoId = Number(document.getElementById("movFormProducto").value);
        var rChecked = document.querySelector("input[name='movTipo']:checked");
        var tipo = rChecked ? rChecked.value : 'entrada';
        var cantidad = Number(document.getElementById("movFormCantidad").value);
        var motivo = document.getElementById("movFormMotivo").value;
        var fecha = document.getElementById("movFormFecha").value;
        var usuario = document.getElementById("movFormUsuario").value;

        if (!productoId || cantidad <= 0 || !motivo) {
            alert("Por favor completa todos los campos requeridos.");
            return;
        }

        try {
            var resp = await fetch("php/scm_api.php?resource=crear_movimiento", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    producto_id: productoId,
                    tipo: tipo,
                    cantidad: cantidad,
                    motivo: motivo,
                    fecha: fecha,
                    usuario: usuario
                })
            });

            var data = await resp.json();
            if (data.success) {
                cerrarModalNuevoMovimientoSCM();
                if (typeof showNotification === 'function') {
                    showNotification(data.message);
                } else {
                    alert(data.message);
                }
                cargarMovimientosSCM();
                cargarProductosParaFiltroMov();
            } else {
                alert("Error al registrar movimiento:\n" + (data.error || "Operación no permitida"));
            }
        } catch (e) {
            alert("Error de conexión: " + e.message);
        }
    }

    // Exponer a window para asegurar disponibilidad en inline onclicks
    window.cargarProductosParaFiltroMov = cargarProductosParaFiltroMov;
    window.actualizarInfoStockSeleccionado = actualizarInfoStockSeleccionado;
    window.cargarMovimientosSCM = cargarMovimientosSCM;
    window.abrirModalNuevoMovimientoSCM = abrirModalNuevoMovimientoSCM;
    window.cerrarModalNuevoMovimientoSCM = cerrarModalNuevoMovimientoSCM;
    window.guardarMovimientoSCM = guardarMovimientoSCM;
    window.cargarUsuariosParaSelectMov = cargarUsuariosParaSelectMov;

    Promise.all([
        cargarProductosParaFiltroMov(),
        cargarUsuariosParaSelectMov()
    ]).then(() => cargarMovimientosSCM());
</script>
